name: 6sense
description: 6sense Insights is a B2B revenue AI platform that identifies in-market
  accounts from anonymous buying signals and orchestrates marketing and sales against
  them. Its Signalverse intent graph, Master Company Database of roughly 76 million
  company accounts and predictive models power account-based marketing, advertising,
  AI email agents and sales intelligence. For developers, 6sense exposes six HTTP
  data APIs across three hosts — Company Identification, Company Firmographics, Lead
  Scoring, Lead Scoring and Firmographics, People Enrichment and People Search — plus
  the acquired AI Email (Saleswhale) API with a signed webhook surface, and a hosted
  remote MCP server at api.6sense.com/mcp for agent access. Access is token-based and
  metered against contract-year credit pools rather than list-priced plans.
