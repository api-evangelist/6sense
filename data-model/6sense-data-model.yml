    - linkedinId
    - twitterHandle
    profile:
    - skills
    - education
  enums:
    emailConfidence:
    - A+
    - A
    - B
    - C
  privacy_note: >-
    This entity is personal data. Its availability is contractually gated — see
    conformance/6sense-conformance.yml compliance.contractual_gating — and
    6sense propagates opt-out and deletion requests downstream to customers.

- name: PersonSummary
  description: >-
    The reduced Contact projection returned by People Search. Deliberately withholds
    the contact details and returns only hasEmail / hasPhone / hasMobilePhone
    booleans, so search is free and enrichment costs a credit.
  schemas:
  - openapi/6sense-people-api-openapi.yml#/components/schemas/PersonSummary

- name: Education
  description: Nested school/degree history on an enriched contact.
  schemas:
  - openapi/6sense-enrichment-api-openapi.yml#/components/schemas/EnrichedContact

- name: Product
  description: >-
    A customer-configured product line that predictive models score against.
    Listed by getProductsList on the Scribe host.
  operations:
  - openapi/6sense-scribe-openapi.json#getProductsList

