note: >-
  6sense publishes three distinct dated streams and none of them is an API
  changelog for the core data APIs. The product release notes are quarterly and
  platform-facing; the data refresh notes are monthly and are the most decision-
  relevant stream for a data vendor; the only per-change API changelog covers the
  acquired AI Email surface and stopped in January 2023. Recent window only.

