  will miss it. Every entry points at a `.md` twin of the HTML page, and those
  twins resolve — fetching https://support.6sense.com/docs/<slug>.md returns clean
  markdown with YAML frontmatter, which makes the whole knowledge base
  machine-readable without scraping.
