note: >-
  The live MCP tools/list is OAuth-gated (HTTP 401), so no tool NAMES were
  observed. Rows below are keyed on the CAPABILITIES 6sense publishes on its MCP
  overview page, mapped by semantics onto real operationIds verified present in
  the specs in openapi/. Confidence is set accordingly and no tool name is
  asserted as the server's own. The headline finding is a genuine surface
  divergence: the 6sense MCP server projects Revvy AI reporting/analytics over the
  Revenue Marketing platform, while the public REST APIs are record-level
  enrichment and scoring. The two surfaces barely overlap.

