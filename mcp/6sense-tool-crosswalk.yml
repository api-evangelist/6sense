crosswalk:
- tool: account-insights
  category: reporting
  rest:
  - getCompanyDetails
  - companyFirmographics
  binding: rest
  confidence: low
  note: >-
    Partial overlap only. The REST operations return firmographics plus product
    scores for one company; the MCP capability is described as a narrative
    account brief over activity and engagement signals, which has no public REST
    equivalent.
- tool: account-filtering-and-segment-discovery
  category: reporting
  rest:
  - getSegments
  - getSegments_1
  - getAccountsList
  - getAccountsList_1
  - validateSegment
  binding: rest
  confidence: medium
  note: >-
    The Segments operations in the Scribe spec list segments and enumerate their
    member accounts, which is the closest REST analogue to segment discovery.
    6sense documents the Segments API token as partner-only and not
    self-serviceable from the platform UI.

mcp_only:
- tool: 6qa-trend-analysis
  reason: >-
    6QA volume over time and un-engaged 6QA accounts are computed inside the
    Revenue Marketing platform. No public REST operation returns 6QA history; the
    is_6qa boolean on the Company schema is point-in-time only.
- tool: keyword-performance
  reason: Intent keyword performance and trend data have no public REST endpoint.
- tool: ad-campaign-performance
  reason: Advertising campaign metrics have no public REST endpoint.
- tool: website-activity
  reason: >-
    Site-visit and page-view aggregation is a platform report. The Company
    Identification API resolves a single IP to a company; it does not return
    visit history.
- tool: market-research
  reason: Generative research over competitors, personas and market news. No REST backing at all.
- tool: product-support
  reason: >-
    Retrieval over the 6sense knowledge base. The nearest public artifact is
    https://support.6sense.com/llms.txt, not an API operation.

