    support@6sense.com, info.termsOfService https://6sense.com/terms-of-use/. servers[] is absent, so
    the fetch host is the base — and scribe.6sense.com is independently confirmed as a 6sense API host
    by the 6sense API Portal, which documents POST https://scribe.6sense.com/v2/people/score and /v2/people/full
    as the Lead Scoring and Lead Scoring + Firmographics endpoints. No sibling-brand or third-party signal
    anywhere in the document.'
