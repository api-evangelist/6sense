    cadence: monthly
    latest: '2026-07'
    note: >-
      Unusually, 6sense publishes a monthly changelog for the DATA rather than the
      code — accounts created, junk domains removed, fields refreshed, regional
      match-rate lift. For a data provider that is the release note that matters.
  api:
    url: https://docs.saleswhale.com/
    scope: AI Email API only
    latest: '2023-01-17'
    note: >-
      The only dated, per-change API changelog 6sense publishes covers the
      acquired Saleswhale surface and has not been updated since January 2023.
      The core data APIs have no changelog at all — version changes surface only
      as a new number in the portal's version table.
  detail: changelog/6sense-changelog.yml

