versioning:
  scheme: uri-path
  docs: https://api.6sense.com/docs/
  note: >-
    Each API carries its own major version in the path (/v1/, /v2/, /v3/) and
    advances independently. 6sense publishes a per-API "current stable version"
    table and keeps at least one prior version documented and callable for
    several of them, so older versions coexist with current ones rather than
    being removed on release.
  current:
  - api: Company Identification API
    version: v3
    path_prefix: /v3/company/details
    host: epsilon.6sense.com
  - api: Company Firmographics API
    version: v3
    previous_name: Lead Enrichment API
    documented_older_version: v2
    host: api.6sense.com
  - api: Lead Scoring API
    version: v2
    host: scribe.6sense.com
  - api: Lead Scoring and Firmographics API
    version: v2
    previous_name: Lead Enrichment and Scoring API
    host: scribe.6sense.com
  - api: People Enrichment API
    version: v2
    documented_older_version: v1
    host: api.6sense.com
  - api: People Search API
    version: v2
    documented_older_version: v1
    host: api.6sense.com
  - api: AI Email API
    version: v2
    documented_older_version: v1
    host: engage-api.saleswhale.com

deprecation:
  policy_url: https://api.6sense.com/docs/
  policy_published: true
  policy_text: >-
    "Each API will show the list of versions supported. You may receive timely
    notifications to upgrade the APIs to the latest stable version as we will
    deprecate the older versions which are no longer recommended to use."
  mechanism: email/CSM notification
  sunset_header: false
  deprecation_header: false
  notice_period: unpublished
  note: >-
    A deprecation policy exists and is stated in the API Portal, but it is a prose
    commitment rather than a machine-readable one. No RFC 8594 Sunset or
    Deprecation response header is documented, no notice window is quantified,
    and no dated end-of-life schedule is published for any version. An agent
    cannot detect an impending version retirement from the wire.

deprecated_operations: []

