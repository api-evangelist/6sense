note: >-
  6sense publishes NO first-party client libraries in any public package registry.
  This is a measured absence, not an unchecked one: every registry below was
  queried directly and the results are recorded. The 6sense API Portal ships
  copy-paste code samples (cURL, XHR, Postman, NodeJS, Python) instead of an SDK,
  and github.com/6si — 6sense's own GitHub organisation, already linked from
  apis.yml — contains only forks of third-party infrastructure projects (Milvus,
  Hadoop, Spark, TiDB, Presto, Bazel rules) with no 6sense client library among
  them. Integration is expected to happen through the pre-built CRM/MAP
  connectors and the WebTag rather than through code.

