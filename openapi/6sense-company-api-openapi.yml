openapi: 3.2.0
info:
  title: 6sense Company API
  version: '1.0'
  description: 'Operations tagged Company across 2 of this provider''s published API definitions: 6sense-company-identification-api-openapi.yml, 6sense-scribe-openapi.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://epsilon.6sense.com
  description: 6sense Epsilon Production
tags:
- name: Company
paths:
  /v3/company/details:
    get:
      summary: Get Company Details By IP
      description: Identify a company from an IP address. Returns firmographics, scoring, buying stage, profile fit, and segment membership.
      operationId: getCompanyDetails
      parameters:
      - name: ip
        in: query
        description: Visitor IP address (IPv4 or IPv6).
        required: true
        schema:
          type: string
      - name: EpsilonCookie
        in: header
        description: 6sense visitor tracking cookie.
        required: false
        schema:
          type: string
      - name: X-6s-CustomID
        in: header
        description: Custom client-supplied identifier for tracking.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Company identified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyDetailsResponse'
        '401':
          description: Unauthorized.
        '404':
          description: No company match.
        '429':
          description: Rate limit exceeded.
      tags:
      - Company
      security:
      - TokenAuth: []
    servers:
    - url: https://epsilon.6sense.com
      description: 6sense Epsilon Production
  /v1/company/products:
    get:
      operationId: getProductsList
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - API_KEY: []
      tags:
      - Company
  /company/v1/segment/{segment_id}:
    get:
      operationId: getAccountsList
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentAccountsResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
      security:
      - API_KEY: []
      tags:
      - Company
  /company/v1/segments:
    get:
      operationId: getSegments
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgToSegmentsResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
      security:
      - API_KEY: []
      tags:
      - Company
  /v1/company/segment/{segment_id}:
    get:
      operationId: getAccountsList_1
      parameters:
      - name: segment_id
        in: path
        required: true
        schema:
          type: integer
          format: int32
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SegmentAccountsResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
      security:
      - API_KEY: []
      tags:
      - Company
  /v1/company/segments:
    get:
      operationId: getSegments_1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrgToSegmentsResponse'
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
      security:
      - API_KEY: []
      tags:
      - Company
  /v1/company/validate_access/segments:
    get:
      operationId: validateSegment
      responses:
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '402':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      deprecated: true
      security:
      - API_KEY: []
      tags:
