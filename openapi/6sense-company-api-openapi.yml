components:
  schemas:
    ProductScore:
      type: object
      properties:
        product:
          type: string
        product_display_name:
          type: string
        is_6qa:
          type: boolean
        intent_score:
          type: integer
        buying_stage:
          type: string
          enum:
          - Purchase
          - Decision
          - Consideration
          - Awareness
          - Target
        profile_score:
          type: integer
        profile_fit:
          type: string
          enum:
          - Strong
          - Moderate
          - Weak
    CompanyDetailsResponse:
      type: object
      properties:
        company:
          $ref: '#/components/schemas/Company'
        scores:
          type: array
          items:
            $ref: '#/components/schemas/ProductScore'
        segments:
          $ref: '#/components/schemas/Segments'
        confidence:
          type: string
          enum:
          - Very High
          - High
          - Moderate
          - Low
    Segments:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
        names:
          type: array
          items:
            type: string
        list:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
    Company:
      type: object
      properties:
        company_match:
          type: string
          enum:
          - Match
          - Non-actionable Match
          - No Match
        additional_comment:
          type: string
        companyId:
          type: string
        domain:
          type: string
        name:
          type: string
        region:
          type: string
        country:
          type: string
        country_iso_code:
          type: string
        state:
          type: string
        state_code:
          type: string
        city:
          type: string
        address:
          type: string
        zip:
          type: string
        phone:
          type: string
        industry:
          type: string
        industry_v2:
          type: array
          items:
            type: object
            properties:
              industry:
                type: string
              subindustry:
                type: string
        employee_range:
          type: string
        employee_count:
          type: integer
        revenue_range:
          type: string
        annual_revenue:
          type: number
        is_blacklisted:
          type: boolean
        is_6qa:
          type: boolean
        geoIP_country:
          type: string
        geoIP_state:
          type: string
        geoIP_city:
          type: string
        sic:
          type: string
        sic_description:
          type: string
        naics:
          type: string
        naics_description:
          type: string
    ProductResponse:
      type: object
      properties:
        org:
          type: string
        products:
          type: array
          items:
            type: object
            additionalProperties:
              type: string
    ErrorResponse:
      type: object
      properties:
        status:
          type: string
        message:
          type: string
    OrgToSegmentsResponse:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
            format: int32
        names:
          type: array
          items:
            type: string
        list:
          type: array
          items:
            type: object
            additionalProperties:
              type: object
    Account:
      type: object
      properties:
        name:
          type: string
        domain:
          type: string
        country:
          type: string
    SegmentAccountsResponse:
      type: object
      properties:
        count:
          type: integer
          format: int32
        created_at:
          type: string
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
  securitySchemes:
    TokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: 'Token-based auth. Format: `Token <api_token>`.'
    API_KEY:
      type: apiKey
      name: Authorization
      in: header
